name: ci
on:
  pull_request:
    branches: [main]
jobs:
  web-lint-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
  guardapp-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: guardapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: guardapp/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
